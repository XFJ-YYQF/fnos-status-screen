name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psutil
      - name: Syntax checks
        run: |
          python -m py_compile fnos/app/dashboard.py windows-agent/nasscreen_agent.py
          bash -n fnos/cmd/main
      - name: End-to-end smoke test (NAS view -> Windows view -> NAS view)
        run: python tests/e2e.py
      - name: Build packages
        run: bash scripts/build.sh
